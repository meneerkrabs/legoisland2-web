# LEGO Eiland 2 web (https://meneerkrabs.github.io/legoisland2-web/): a byte-range CORS relay for the game's ISO on
# archive.org. archive.org's data nodes honour Range but send no CORS headers; this adds them. Nothing is stored:
# no proxy cache, no temp files, bodies are streamed through. Only whitelisted files are reachable (see the maps).
#   GET https://le2.143-47-181-190.sslip.io/ia/<item>/<iso file name, URL-encoded>   (Range header forwarded)

map $http_origin $le2_cors_origin {
    default "";
    "https://meneerkrabs.github.io" $http_origin;
    "http://localhost:5499" $http_origin;
    "http://127.0.0.1:5499" $http_origin;
    "http://localhost:5498" $http_origin;
}

# raw (still percent-encoded) path after /ia, only for the allowed items: the two LEGO Eiland 2 ISOs and the
# Island Xtreme Stunts disc (raw 2352-byte sectors) that the built-in "IXS-look" mod reads a few texture banks from,
# and the three Dutch community mods (JappaWakka) stored next to the Dutch ISO
map $request_uri $le2_ia_path {
    default "";
    "~^/ia(?<le2p>/(legoeiland2dutch|legoeiland2)/[^/?]+\.iso)(\?.*)?$" $le2p;
    "~^/ia(?<le2p>/lixsrgn-1/LIXSRGN1\.BIN)(\?.*)?$" $le2p;
    "~^/ia(?<le2p>/legoeiland2dutch/li2_[a-z_-]+_dutch\.zip)(\?.*)?$" $le2p;
}

# community mods loaded from where their authors published them (nothing is stored here):
#   /x/ore/misc/<file>.zip|.rar                                  -> ore.rockraidersunited.org (RRU's file bucket)
#   /x/gh/JeffRuLz/LI2-Mod-Manager/releases/download/<tag>/<file> -> github.com (redirects to GitHub's asset storage)
#   /x/gh/JeffRuLz/LI2-Mod-Manager/files/<id>/<file>
map $request_uri $le2_x_url {
    default "";
    "~^/x/ore(?<le2x>/misc/[A-Za-z0-9_%().+-]+\.(zip|rar))$" https://ore.rockraidersunited.org$le2x;
    "~^/x/gh(?<le2x>/JeffRuLz/LI2-Mod-Manager/(releases/download/[A-Za-z0-9._-]+|files/[0-9]+)/[A-Za-z0-9_%().+-]+)$" https://github.com$le2x;
}

server {
    server_name le2.143-47-181-190.sslip.io;

    access_log off;
    error_log /var/log/nginx/le2-proxy.error.log warn;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 10s;

    location = / { return 200 "LEGO Eiland 2 range relay\n"; add_header Content-Type text/plain; }

    location /ia/ {
        if ($le2_ia_path = "") { return 404; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $le2_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        proxy_pass https://archive.org/download$le2_ia_path;
        proxy_ssl_server_name on;
        proxy_set_header Host archive.org;
        proxy_set_header Range $http_range;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @le2_follow;
        include /etc/nginx/le2-proxy-common.inc;
    }

    location /x/ {
        if ($le2_x_url = "") { return 404; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $le2_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        proxy_pass $le2_x_url;
        proxy_ssl_server_name on;
        proxy_set_header Range $http_range;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @le2_follow;
        include /etc/nginx/le2-proxy-common.inc;
    }

    # archive.org/download answers with a redirect to the data node that holds the ISO: follow it server-side
    location @le2_follow {
        set $le2_target $upstream_http_location;
        proxy_pass $le2_target;
        proxy_ssl_server_name on;
        proxy_set_header Range $http_range;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        include /etc/nginx/le2-proxy-common.inc;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/le2.143-47-181-190.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/le2.143-47-181-190.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = le2.143-47-181-190.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name le2.143-47-181-190.sslip.io;
    return 404; # managed by Certbot


}